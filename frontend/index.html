<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111311">
    <title>APIForge - Backend Compiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand" aria-label="APIForge backend compiler">
                <span class="brand-mark" aria-hidden="true">AF</span>
                <div class="brand-copy">
                    <h1>APIForge</h1>
                    <p>Backend compiler</p>
                </div>
            </div>
            <div id="header-status" class="header-status" role="status">
                <span class="ready-dot" aria-hidden="true"></span>
                <span id="header-status-text">Compiler ready</span>
            </div>
        </header>

        <main class="workbench">
            <section class="editor-panel" aria-labelledby="editor-title">
                <div class="panel-header editor-header">
                    <div>
                        <h2 id="editor-title" class="panel-title">main.apiforge</h2>
                        <p id="example-name" class="panel-meta">Basic Student Entity</p>
                    </div>
                    <span class="file-state">DSL source</span>
                </div>

                <div class="editor-wrapper">
                    <div id="line-numbers" class="line-numbers" aria-hidden="true"><div>1</div></div>
                    <div class="editor-container">
                        <div id="editor-backdrop" class="editor-backdrop" aria-hidden="true">
                            <div id="editor-highlights" class="editor-highlights"></div>
                        </div>
                        <label class="sr-only" for="dsl-editor">APIForge DSL source</label>
                        <textarea id="dsl-editor" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Define your APIForge entities and relationships..."></textarea>
                    </div>
                </div>

                <div class="editor-toolbar" aria-label="Editor actions">
                    <div class="target-control">
                        <span id="target-label" class="target-label">Target</span>
                        <div class="target-segments" role="group" aria-labelledby="target-label">
                            <button class="target-option" type="button" data-target="mysql" aria-pressed="true">MySQL</button>
                            <button class="target-option" type="button" data-target="postgres" aria-pressed="false">PostgreSQL</button>
                        </div>
                    </div>
                    <button id="compile-btn" class="btn btn-primary" type="button">
                        <span class="button-icon" aria-hidden="true">▶</span>
                        <span class="button-label">Compile</span>
                        <kbd>Ctrl Enter</kbd>
                    </button>
                    <button id="demo-btn" class="btn btn-demo" type="button">Load demo</button>
                    <button id="example-btn" class="btn" type="button">Load example</button>
                    <button id="clear-btn" class="btn btn-quiet" type="button">Clear</button>
                </div>
            </section>

            <section class="output-panel" aria-labelledby="inspector-title">
                <div class="inspector-heading">
                    <div>
                        <h2 id="inspector-title" class="panel-title">Compiler inspector</h2>
                        <p class="panel-meta">Intermediate representations and generated targets</p>
                    </div>
                </div>

                <div class="tab-bar" role="tablist" aria-label="Compiler output">
                    <button id="tab-tokens" class="tab-btn active" role="tab" aria-selected="true" aria-controls="output-tokens" tabindex="0" data-tab="tokens">Tokens</button>
                    <button id="tab-ast" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-ast" tabindex="-1" data-tab="ast">AST</button>
                    <button id="tab-symboltable" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-symboltable" tabindex="-1" data-tab="symboltable">Symbols</button>
                    <button id="tab-ir" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-ir" tabindex="-1" data-tab="ir">IR</button>
                    <button id="tab-optimized-ir" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-optimized-ir" tabindex="-1" data-tab="optimized-ir">Optimized IR</button>
                    <button id="tab-sql" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-sql" tabindex="-1" data-tab="sql">SQL</button>
                    <button id="tab-endpoints" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-endpoints" tabindex="-1" data-tab="endpoints">Endpoints</button>
                    <button id="tab-api" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-api" tabindex="-1" data-tab="api">API</button>
                    <button id="tab-swagger" class="tab-btn" role="tab" aria-selected="false" aria-controls="output-swagger" tabindex="-1" data-tab="swagger">OpenAPI</button>
                </div>

                <div class="output-content">
                    <div id="compilation-summary" class="compilation-summary">
                        <div id="compilation-summary-content" class="summary-content" role="status" aria-live="polite"></div>
                        <div class="download-section" id="download-section">
                            <button id="download-btn" class="btn btn-download" type="button">
                                <span aria-hidden="true">↓</span> Download generated project
                            </button>
                        </div>
                    </div>
                    <div id="error-panel" class="error-panel" role="alert" aria-live="assertive"></div>

                    <div id="output-tokens" class="output-pane active" role="tabpanel" aria-labelledby="tab-tokens" tabindex="0"></div>
                    <div id="output-ast" class="output-pane" role="tabpanel" aria-labelledby="tab-ast" tabindex="0" hidden></div>
                    <div id="output-symboltable" class="output-pane" role="tabpanel" aria-labelledby="tab-symboltable" tabindex="0" hidden></div>
                    <div id="output-ir" class="output-pane" role="tabpanel" aria-labelledby="tab-ir" tabindex="0" hidden></div>
                    <div id="output-optimized-ir" class="output-pane" role="tabpanel" aria-labelledby="tab-optimized-ir" tabindex="0" hidden></div>
                    <div id="output-sql" class="output-pane" role="tabpanel" aria-labelledby="tab-sql" tabindex="0" hidden></div>
                    <div id="output-endpoints" class="output-pane" role="tabpanel" aria-labelledby="tab-endpoints" tabindex="0" hidden></div>
                    <div id="output-api" class="output-pane" role="tabpanel" aria-labelledby="tab-api" tabindex="0" hidden></div>
                    <div id="output-swagger" class="output-pane" role="tabpanel" aria-labelledby="tab-swagger" tabindex="0" hidden></div>
                </div>
            </section>
        </main>

        <section class="pipeline" aria-labelledby="pipeline-title">
            <div class="pipeline-heading">
                <h2 id="pipeline-title">Compiler pipeline</h2>
                <p id="pipeline-state" aria-live="polite">Waiting for compilation</p>
            </div>
            <div class="pipeline-track">
                <button id="status-lexer" class="status-item" type="button" data-phase="lexer" aria-label="Lexer phase: pending" title="Phase 1: Lexical analysis. Open Tokens."><span class="status-icon pending" aria-hidden="true">○</span><span class="status-label">Lexer</span></button>
                <button id="status-parser" class="status-item" type="button" data-phase="parser" aria-label="Parser phase: pending" title="Phase 2: Syntax analysis. Open AST."><span class="status-icon pending" aria-hidden="true">○</span><span class="status-label">Parser</span></button>
                <button id="status-semantic" class="status-item" type="button" data-phase="semantic" aria-label="Semantic phase: pending" title="Phase 3: Semantic analysis. Open Symbols."><span class="status-icon pending" aria-hidden="true">○</span><span class="status-label">Semantic</span></button>
                <button id="status-ir" class="status-item" type="button" data-phase="ir" aria-label="IR phase: pending" title="Phase 4: IR generation. Open IR."><span class="status-icon pending" aria-hidden="true">○</span><span class="status-label">IR</span></button>
                <button id="status-optimizer" class="status-item" type="button" data-phase="optimizer" aria-label="Optimizer phase: pending" title="Phase 5: Optimization. Open Optimized IR."><span class="status-icon pending" aria-hidden="true">○</span><span class="status-label">Optimizer</span></button>
                <button id="status-codegen" class="status-item" type="button" data-phase="codegen" aria-label="CodeGen phase: pending" title="Phase 6: Code generation. Open SQL."><span class="status-icon pending" aria-hidden="true">○</span><span class="status-label">CodeGen</span></button>
            </div>
        </section>
    </div>

    <script src="source-frame.js"></script>
    <script src="app.js"></script>
</body>
</html>
